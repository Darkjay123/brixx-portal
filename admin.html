<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>The Brixx — Leadership Admin</title>
<meta name="description" content="The Brixx is a global team of creatives. We make movies, drama, skits and stage productions. Watch our work, join the house, get your Brixx number.">
<meta property="og:title" content="The Brixx — Leadership Admin">
<meta property="og:description" content="Drama. Movies. Skits. Stage. Join the house.">
<meta property="og:image" content="assets/poster.jpg">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --burg:#780115; --burg2:#5d000f; --gold:#F7B638; --gold2:#ffcf6b;
  --ink:#141114; --ink2:#1b161a; --ink3:#241d24;
  --line:rgba(255,255,255,.09); --mut:rgba(255,255,255,.62);
  --white:#fff;
  --disp:'Anton',Impact,sans-serif; --body:'Manrope',system-ui,sans-serif; --serif:'Playfair Display',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:86px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--ink);color:var(--white);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:hidden;touch-action:manipulation}
body.lock{overflow:hidden}
::selection{background:var(--gold);color:var(--ink)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:200;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:26px;transition:transform .8s cubic-bezier(.77,0,.18,1),opacity .6s}
#loader.done{transform:translateY(-100%);opacity:.4;pointer-events:none}
.ldwall{display:grid;grid-template-columns:repeat(6,34px);gap:3px;transform:rotate(-4deg)}
.ldwall i{width:34px;height:14px;border-radius:2px;background:var(--burg);opacity:0;transform:translateY(8px);transition:opacity .18s,transform .3s;box-shadow:0 0 0 1px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.12)}
.ldwall i:nth-child(3n){background:var(--burg2)}
.ldwall i.on{opacity:1;transform:translateY(0)}
.ldwall i.glow{box-shadow:0 0 14px rgba(247,182,56,.8),inset 0 2px 0 rgba(255,255,255,.3)}
.ldlogo{width:min(250px,56vw);opacity:0;transform:scale(.82);transition:all .6s cubic-bezier(.2,.9,.3,1.25);filter:drop-shadow(0 0 34px rgba(247,182,56,.28)) drop-shadow(0 14px 40px rgba(120,1,21,.55))}
.ldlogo.on{opacity:1;transform:scale(1)}
.ldbar{width:180px;height:2px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
.ldbar i{position:absolute;inset:0;background:var(--gold);transform-origin:left;transform:scaleX(0);transition:transform .15s linear}
.ldpct{font-size:.72rem;letter-spacing:.34em;color:var(--mut)}

/* ---------- progress + cursor ---------- */
#progress{position:fixed;top:0;left:0;height:3px;width:100%;z-index:120;background:transparent}
#progress i{display:block;height:100%;background:linear-gradient(90deg,var(--burg),var(--gold));transform-origin:left;transform:scaleX(0)}
#cursor{position:fixed;top:0;left:0;z-index:190;pointer-events:none;mix-blend-mode:normal}
#cdot{position:absolute;width:8px;height:8px;border-radius:2px;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg);left:-100px;top:-100px}
#cring{position:absolute;width:34px;height:34px;border-radius:8px;border:1px solid rgba(247,182,56,.5);transform:translate(-50%,-50%) rotate(45deg);left:-100px;top:-100px;transition:width .2s,height .2s,border-color .2s,background .2s}
#cursor.hov #cring{width:52px;height:52px;background:rgba(247,182,56,.08);border-color:var(--gold)}
@media (pointer:coarse){#cursor{display:none}}

/* ---------- topbar ---------- */
#top{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:16px clamp(18px,4vw,44px);transition:background .35s,padding .35s,border-color .35s;border-bottom:1px solid transparent}
#top.scrolled{background:rgba(20,17,20,.82);backdrop-filter:blur(14px);border-bottom-color:var(--line);padding:10px clamp(18px,4vw,44px)}
.brand{display:flex;align-items:center;gap:12px}
.blogo{height:44px;width:auto;display:block;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5));flex:none}
.flogo{width:120px;margin:0 auto 10px;opacity:.92;filter:drop-shadow(0 10px 34px rgba(120,1,21,.55))}
.brand b{font-family:var(--disp);font-size:1.15rem;letter-spacing:.08em;font-weight:400}
.brand small{display:block;font-size:.55rem;letter-spacing:.42em;color:var(--gold2);margin-top:-2px;text-shadow:0 1px 8px rgba(0,0,0,.8)}
#top nav{display:flex;align-items:center;gap:clamp(14px,2.4vw,30px)}
#top nav a{font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);position:relative;padding:4px 0}
#top nav a:not(.cta)::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:right;transition:transform .3s}
#top nav a:not(.cta):hover{color:#fff}
#top nav a:not(.cta):hover::after{transform:scaleX(1);transform-origin:left}
#top nav a.cta{background:linear-gradient(135deg,#ffd469,var(--gold) 50%,#e0931d);color:var(--ink);padding:11px 20px;border-radius:12px;box-shadow:0 6px 18px rgba(247,182,56,.32),0 1px 0 rgba(255,255,255,.5) inset;transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
#top nav a.cta:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(247,182,56,.5),0 1px 0 rgba(255,255,255,.5) inset}
#top nav a.cta:active{transform:scale(.94)}
@media (max-width:760px){#top nav a:not(.cta){display:none}}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden}
.herovid{position:absolute;inset:0}
.herovid video{width:100%;height:100%;object-fit:cover;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12)}}
.herovid::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,17,20,.55) 0%,rgba(20,17,20,.1) 40%,rgba(20,17,20,.92) 92%)}
.herovid::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(20,17,20,.75))}
#bricks{position:absolute;inset:0;opacity:.55;pointer-events:none}
.hero-inner{position:relative;z-index:3;width:100%;padding:0 clamp(18px,4vw,44px) clamp(64px,9vh,110px);max-width:1400px}
.kicker{font-size:.72rem;font-weight:800;letter-spacing:.4em;color:var(--gold2);margin-bottom:14px;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.display{font-family:var(--disp);font-weight:400;line-height:.92;letter-spacing:.01em;text-transform:uppercase}
h1.display{font-size:clamp(4.2rem,15vw,12.5rem)}
h1.display .ch{display:inline-block;opacity:0;transform:translateY(.5em) rotate(6deg);transition:opacity .5s,transform .7s cubic-bezier(.2,.9,.3,1.15);transition-delay:calc(var(--i)*55ms)}
body.go h1.display .ch{opacity:1;transform:none}
h1.display .dot{color:var(--gold)}
.herosub{display:flex;flex-wrap:wrap;gap:10px 0;margin:18px 0 10px;font-weight:800;letter-spacing:.3em;font-size:clamp(.72rem,1.6vw,1rem);text-transform:uppercase;color:#fff}
.herosub s{color:var(--gold);text-decoration:none;padding:0 14px}
.heroline{max-width:560px;color:var(--mut);font-size:clamp(.95rem,1.6vw,1.08rem)}
.hero-cta{display:flex;gap:14px;margin-top:28px;flex-wrap:wrap}
.btnx{position:relative;display:inline-flex;align-items:center;gap:10px;padding:17px 32px;border-radius:14px;font-weight:800;letter-spacing:.12em;font-size:.8rem;text-transform:uppercase;overflow:hidden;cursor:pointer;transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .35s;will-change:transform}
.btnx:active{transform:scale(.955);transition-duration:.08s}
.btnx:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btnx.gold{background:linear-gradient(135deg,#ffd469,var(--gold) 45%,#e0931d);color:#231303;box-shadow:0 12px 32px rgba(247,182,56,.32),0 1px 0 rgba(255,255,255,.55) inset,0 -3px 0 rgba(120,60,0,.2) inset,0 0 0 1px rgba(255,222,130,.55) inset}
.btnx.gold::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.55) 50%,transparent 68%);transform:translateX(-130%);transition:transform .7s ease}
.btnx.gold:hover{transform:translateY(-3px);box-shadow:0 20px 48px rgba(247,182,56,.48),0 1px 0 rgba(255,255,255,.55) inset,0 -3px 0 rgba(120,60,0,.2) inset,0 0 0 1px rgba(255,222,130,.55) inset}
.btnx.gold:hover::before{transform:translateX(130%)}
.btnx.ghost{background:rgba(255,255,255,.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.28);color:#fff;box-shadow:0 12px 32px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.14) inset}
.btnx.ghost::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(247,182,56,.14);opacity:0;transition:opacity .3s}
.btnx.ghost:hover{transform:translateY(-3px);border-color:var(--gold);color:var(--gold);box-shadow:0 20px 44px rgba(0,0,0,.5)}
.btnx.ghost:hover::before{opacity:1}
.scrollcue{position:absolute;right:clamp(18px,4vw,44px);bottom:34px;z-index:4;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--mut);font-size:.62rem;letter-spacing:.34em;writing-mode:vertical-rl}
.scrollcue i{width:1px;height:64px;background:linear-gradient(var(--gold),transparent);display:block;animation:cue 1.8s ease-in-out infinite;writing-mode:initial}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---------- marquee ---------- */
.marquee{background:var(--burg);border-top:1px solid rgba(247,182,56,.4);border-bottom:1px solid rgba(247,182,56,.4);overflow:hidden;padding:16px 0;position:relative;z-index:3}
.mtrack{display:flex;gap:0;width:max-content;animation:mq 26s linear infinite}
.marquee:hover .mtrack{animation-play-state:paused}
.mtrack span{font-family:var(--disp);font-size:clamp(1.6rem,3.4vw,2.6rem);letter-spacing:.06em;white-space:nowrap;padding:0 26px;text-transform:uppercase}
.mtrack em{font-style:normal;color:var(--gold);padding:0 26px}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- sections ---------- */
.wrap{max-width:1400px;margin:0 auto;padding:clamp(70px,11vh,130px) clamp(18px,4vw,44px)}
.slabel{display:flex;align-items:center;gap:14px;font-size:.7rem;font-weight:800;letter-spacing:.4em;color:var(--gold);text-transform:uppercase;margin-bottom:22px}
.slabel::before{content:"";width:44px;height:2px;background:var(--gold)}
h2.display{font-size:clamp(2.6rem,7vw,5.6rem)}
.about{background:var(--ink2)}
.fillwords{max-width:1100px}
.fillwords .w{opacity:.22;transition:opacity .3s,color .3s}
.fillwords .w.lit{opacity:1}
.about p.lead{max-width:640px;color:var(--mut);font-size:clamp(1rem,1.7vw,1.15rem);margin-top:26px}
.about p.lead b{color:#fff}
.caps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:54px}
.cap{background:var(--ink3);border:1px solid var(--line);border-radius:16px;padding:26px 24px;position:relative;overflow:hidden;transition:transform .3s,border-color .3s}
.cap:hover{transform:translateY(-6px);border-color:rgba(247,182,56,.5)}
.cap::before{content:"";position:absolute;top:0;left:0;width:100%;height:3px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .35s}
.cap:hover::before{transform:scaleX(1)}
.cap b{font-family:var(--disp);font-size:2.4rem;color:rgba(255,255,255,.1);position:absolute;top:14px;right:18px}
.cap h3{font-size:1.3rem;font-weight:800;letter-spacing:.02em;margin-bottom:8px}
.cap p{color:var(--mut);font-size:.92rem}

/* ---------- work ---------- */
.work{background:var(--ink)}
.workgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:48px}
.wcard{grid-column:span 4;position:relative;border-radius:16px;overflow:hidden;background:var(--ink3);cursor:pointer;border:1px solid var(--line);transition:transform .35s,border-color .35s}
.wcard:hover{transform:translateY(-6px);border-color:rgba(247,182,56,.55)}
.wcard .thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000}
.wcard .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .6s,filter .6s;filter:saturate(.9)}
.wcard:hover .thumb img{transform:scale(1.06);filter:saturate(1.1)}
.wcard .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(20,17,20,.9))}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2}
.play i{width:64px;height:64px;border-radius:50%;background:rgba(20,17,20,.72);border:1px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;transition:transform .3s,background .3s;backdrop-filter:blur(4px)}
.play i::before{content:"";border-left:18px solid var(--gold);border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:4px}
.wcard:hover .play i{transform:scale(1.12);background:rgba(120,1,21,.85)}
.wmeta{padding:16px 18px 18px}
.wtag{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.wtitle{font-weight:800;font-size:1.02rem;line-height:1.35}
.wfeat{grid-column:span 7}
.wfeat .wtitle{font-family:var(--disp);font-weight:400;font-size:clamp(1.5rem,2.6vw,2.2rem);letter-spacing:.02em;text-transform:uppercase}
.wsm{grid-column:span 5}
@media (max-width:980px){.wcard{grid-column:span 6}.wfeat,.wsm{grid-column:span 12}}
@media (max-width:640px){.wcard{grid-column:span 12}}
.morelink{display:inline-flex;align-items:center;gap:10px;margin-top:36px;font-weight:800;letter-spacing:.14em;font-size:.8rem;text-transform:uppercase;color:var(--gold);border-bottom:2px solid transparent;padding-bottom:4px;transition:border-color .3s}
.morelink:hover{border-color:var(--gold)}

/* ---------- interstitial ---------- */
.inter{position:relative;padding:clamp(90px,16vh,170px) 0;overflow:hidden;text-align:center}
.inter .bg{position:absolute;inset:-20%;background:linear-gradient(135deg,var(--burg2),var(--burg) 55%,#8d0a1d);z-index:0}
.inter .bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.28) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.28) 2px,transparent 2px),linear-gradient(90deg,transparent 0,transparent calc(100% - 2px),rgba(0,0,0,.28) calc(100% - 2px));background-size:100% 26px,120px 26px,120px 26px}
.inter h2{position:relative;z-index:2;font-size:clamp(2.4rem,7vw,6rem);color:#fff;padding:0 20px}
.inter h2 em{font-family:var(--serif);font-style:italic;text-transform:none;color:var(--gold);font-size:.9em}
.inter .bigbrick{position:absolute;border-radius:4px;background:rgba(0,0,0,.18);box-shadow:0 0 0 1px rgba(255,255,255,.06)}

/* ---------- join ---------- */
.join{background:var(--ink2)}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:50px}
.door{position:relative;border-radius:20px;padding:40px 34px 36px;background:var(--ink3);border:1px solid var(--line);overflow:hidden;transition:transform .3s,border-color .3s;transform-style:preserve-3d}
.door:hover{border-color:rgba(247,182,56,.6)}
.door .dno{font-family:var(--disp);font-size:5.4rem;color:rgba(255,255,255,.07);position:absolute;top:-6px;right:20px;line-height:1}
.door h3{font-size:1.6rem;font-weight:800;margin-bottom:12px}
.door p{color:var(--mut);font-size:.98rem;max-width:420px}
.door .dgo{display:inline-flex;align-items:center;gap:10px;margin-top:28px;font-weight:800;letter-spacing:.14em;font-size:.74rem;text-transform:uppercase;color:var(--gold);background:rgba(247,182,56,.1);border:1px solid rgba(247,182,56,.4);padding:12px 20px;border-radius:12px;transition:transform .3s,background .3s,box-shadow .3s}
.door .dgo i{transition:transform .3s;font-style:normal}
.door:hover .dgo i{transform:translateX(6px)}
.door:hover .dgo{transform:translateX(4px);background:rgba(247,182,56,.18);box-shadow:0 10px 26px rgba(247,182,56,.18)}
.door.goldfill .dgo{color:var(--ink);background:rgba(20,17,20,.12);border-color:rgba(20,17,20,.4)}
.door.goldfill:hover .dgo{background:rgba(20,17,20,.2);box-shadow:none}
.door.goldfill{background:linear-gradient(135deg,var(--gold),#e09a1f);color:var(--ink)}
.door.goldfill p{color:rgba(20,17,20,.75)}
.door.goldfill .dno{color:rgba(20,17,20,.14)}
.door.goldfill h3{color:var(--ink)}
.door.goldfill .dgo{color:var(--ink)}
.idcard{margin:60px auto 0;max-width:430px;background:linear-gradient(135deg,var(--burg),var(--burg2));border-radius:18px;padding:26px 26px 22px;position:relative;overflow:hidden;border:1px solid rgba(247,182,56,.35);box-shadow:0 30px 70px rgba(0,0,0,.5);transform:rotate(-2deg)}
.idcard::after{content:"";position:absolute;top:-60%;left:-30%;width:36%;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);transform:rotate(18deg);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,55%{left:-40%}85%,100%{left:130%}}
.idcard .ih{display:flex;justify-content:space-between;align-items:center;font-size:.62rem;letter-spacing:.34em;color:rgba(255,255,255,.75)}
.idcard .ih b{color:var(--gold)}
.idcard .inum{font-family:var(--disp);font-size:2.5rem;letter-spacing:.05em;margin:16px 0 4px}
.idcard .ilow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:.68rem;letter-spacing:.18em;color:rgba(255,255,255,.8);text-transform:uppercase}
.idcard .ilow small{display:block;color:rgba(255,255,255,.55);letter-spacing:.1em;text-transform:none;font-size:.66rem;margin-top:2px}
.idchip{width:34px;height:26px;border-radius:5px;background:linear-gradient(135deg,var(--gold2),var(--gold));position:relative}
.idchip::after{content:"";position:absolute;inset:6px 8px;border-radius:3px;border:1px dashed rgba(20,17,20,.5)}

/* ---------- footer ---------- */
footer{background:var(--ink);border-top:1px solid var(--line);position:relative;overflow:hidden}
footer .fmark{font-family:var(--disp);font-size:clamp(4rem,16vw,13rem);line-height:.9;color:rgba(255,255,255,.05);white-space:nowrap;text-align:center;padding-top:40px;user-select:none}
footer .frow{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;padding:26px clamp(18px,4vw,44px) 40px;position:relative;z-index:2}
footer .ftag{font-family:var(--serif);font-style:italic;color:var(--mut);font-size:1.05rem}
footer .flinks{display:flex;gap:22px;flex-wrap:wrap}
footer .flinks a{font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
footer .flinks a:hover{color:var(--gold)}
footer .fnote{padding:0 clamp(18px,4vw,44px) 26px;color:rgba(255,255,255,.35);font-size:.72rem;position:relative;z-index:2}

/* ---------- hero cinema frame (phones) ---------- */
.hero-frame-wrap{display:none}
@media (max-width:820px){
  .herovid{inset:-12%}
  .herovid video{filter:blur(22px) brightness(.52) saturate(1.15);transform:scale(1.3)}
  .herovid::before{background:linear-gradient(180deg,rgba(20,17,20,.6) 0%,rgba(20,17,20,.35) 40%,rgba(20,17,20,.95) 92%)}
  .hero-frame-wrap{display:block;width:100%;margin-bottom:30px}
  .heroframe{width:min(100%,540px);margin:0 auto;aspect-ratio:16/9;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.22);box-shadow:0 24px 70px rgba(0,0,0,.65),0 0 0 5px rgba(247,182,56,.05)}
  .heroframe video{width:100%;height:100%;object-fit:cover;display:block}
  .hero-inner{padding-bottom:56px}
  h1.display{font-size:clamp(3.6rem,16vw,6rem)}
}
/* ---------- ripple ---------- */
.ripple{position:absolute;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.55);transform:translate(-50%,-50%) scale(0);animation:rip .6s ease-out forwards;pointer-events:none;z-index:3}
@keyframes rip{to{opacity:0;transform:translate(-50%,-50%) scale(16)}}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s cubic-bezier(.2,.7,.3,1),transform .8s cubic-bezier(.2,.7,.3,1);transition-delay:calc(var(--i,0)*70ms)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;transition-duration:.001s !important}
  html{scroll-behavior:auto}
  .rv{opacity:1;transform:none}
  .fillwords .w{opacity:1}
}

var STAGES=["Application submitted","Monologue under review","Shortlisted, quiz unlocked","Preliminary quiz written","Selection decision","Acceptance fee & welcome"];
function stageIndex(st){return {submitted:1,reviewing:2,"quiz-unlocked":2,"quiz-done":3,"quiz-done-fail":3,selected:4,member:5,rejected:3}[st]||1;}
function statusPill(st){var m={submitted:["Submitted","sub"],reviewing:["Under review","sub"],"quiz-unlocked":["Quiz unlocked","quiz"],"quiz-done":["Quiz submitted","quiz"],"quiz-done-fail":["Quiz below pass mark","quiz"],selected:["Selected. Pay acceptance fee","pay"],member:["Member","mem"],rejected:["Not selected","rej"]};var x=m[st]||["Submitted","sub"];return '<span class="pill '+x[1]+'">'+x[0]+'</span>';}
function viewStatus(){
  document.getElementById("view").innerHTML=
  '<div class="sec">Application status</div>'+
  '<div class="card"><label>Enter your application ID (example APP-2026-0114)</label>'+
  '<div style="display:flex;gap:10px;flex-wrap:wrap"><input id="s_id" style="flex:1;min-width:200px" placeholder="APP-2026-...."><button class="btn burg" onclick="lookupApp()">Check status</button></div></div>'+
  '<div id="statusout"></div>';
  var pre=(location.hash.split("?")[1]||"");
  if(pre){document.getElementById("s_id").value=decodeURIComponent(pre.split("=")[1]||"");lookupApp();}

function lookupApp(){
  var id=(document.getElementById("s_id").value||"").trim().toUpperCase();
  var dbx=db(),a=dbx.apps.find(function(x){return x.id==id});
  var out=document.getElementById("statusout");
  if(!a){out.innerHTML='<div class="card" style="margin-top:14px">No application found with that ID. Check the number, or submit at Join Us.</div>';return;}
  var idx=stageIndex(a.status);
  var h='<div class="card" style="margin-top:14px">'+
  '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><b style="font-size:1.1rem">'+esc(a.name)+'</b> <span class="stat">applied '+a.created+'</span><br><span class="stat">Wants: '+esc(a.dept||"")+'</span></div>'+statusPill(a.status)+'</div>'+
  '<div class="flow">'+STAGES.map(function(s,i){return '<div class="st '+(i+1<idx?"done":i+1==idx?"now":"")+'">'+s+'</div>'}).join("")+'</div>';
  if(a.status=="quiz-unlocked"){h+='<div class="notice"><b>You are shortlisted!</b> Read the Brixx manual first, then take the timed preliminary quiz. 15 minutes, '+MAX_STRIKES+' tab-switch warnings and the quiz auto-submits.</div><button class="btn gold" onclick="startQuiz(\''+a.id+'\')">Start my timed quiz</button>';}
  else if(a.status=="quiz-done"){h+='<p class="stat">Quiz submitted. Score: <b>'+a.score+'%</b>. Waiting for the selection decision.</p>';}
  else if(a.status=="quiz-done-fail"){h+='<p class="stat">Quiz score '+a.score+'% is below the '+PASS_MARK+'% pass mark. See the leadership team about a re-take window.</p>';}
  else if(a.status=="selected"){h+='<div class="notice"><b>Congratulations, you are selected!</b> Complete your acceptance fee to claim your place and your merch kit.</div><button class="btn gold" onclick="go(\'pay?app='+a.id+'\')">Pay acceptance fee</button>';}
  else if(a.status=="member"){h+='<p>Your membership is active. Log in at Member login with your Brixx number.</p>';}
  else if(a.status=="rejected"){h+='<p class="stat">This application was not selected this intake. You are welcome to apply again next intake.</p>';}
  else{h+='<p class="stat">We review monologues weekly. Check back here, this page updates as your application moves.</p>';}
  h+='</div>';
  out.innerHTML=h;
}

/* ---------- QUIZ ---------- */
var Q=[
 ["In stage terms, what is a monologue?","A solo performance piece by one character","The curtain at the back of the stage","A group dance routine","The intermission break",0],
 ["What does 'downstage' mean?","The back of the stage","Toward the audience","The dressing room","The orchestra pit",1],
 ["In theatre, what is 'blocking'?","Stopping the show","Planning exactly where actors move and stand","Refusing to act","Lowering the curtain",1],
 ["What is improvisation?","Acting without a prepared script, making it up in the moment","Singing in parts","Repeating lines after the director","Memorising a script",0],
 ["What does a stage manager mainly do?","Writes the sermons","Runs the show: cues, timing and coordination backstage","Designs posters only","Plays the keyboard",1],
 ["What is the 'fourth wall'?","The wall behind the audience","The imaginary wall between actors and audience","A storage room","The sound desk",1],
 ["In church drama, the primary purpose of a skit is to","Win competitions","Communicate a spiritual truth the congregation can act on","Show off costumes","Fill time in service",1],
 ["What is a 'cue'?","A costume change","A signal for a light, sound or actor to go","The interval","A rehearsal schedule",1],
 ["What is 'projection'?","Throwing your voice loudly and clearly to reach the whole audience","Pointing at the audience","Projecting slides","Standing still",0],
 ["If you forget your line on stage, the best move is to","Stop and apologise","Stay in character and improvise until you pick the thread","Walk off stage","Blame the prompter loudly",1],
 ["What is a 'dress rehearsal'?","A rehearsal in full costume and technical setup, close to show conditions","Rehearsal of clothing rules","A fashion show","The first read-through",0],
 ["What does 'stay in character' require from an actor?","Remaining believable in your role even during mistakes","Only acting villains","Wearing the same outfit daily","Reading the script once",0]
];
var quizState=null;
function startQuiz(appId){
  var dbx=db(),a=dbx.apps.find(function(x){return x.id==appId});
  if(!a)return;
  quizState={appId:appId,answers:Array(Q.length).fill(-1),i:0,left:QUIZ_MINS*60,running:true,strikes:0};
  location.hash="#/quiz";
  render();
}
function viewQuiz(){
  if(!quizState){
    document.getElementById("view").innerHTML='<div class="sec">Preliminary quiz</div>'+
    '<div class="card"><p>This quiz only opens for shortlisted applicants. Enter the application ID that was shortlisted.</p>'+
    '<label>Application ID</label><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="q_id" style="flex:1;min-width:200px" placeholder="APP-2026-...."><button class="btn burg" onclick="quizEnter()">Continue</button></div>'+
    '<div class="notice" style="margin-top:16px"><b>Rules:</b> '+QUIZ_MINS+' minutes, '+Q.length+' questions, '+PASS_MARK+'% to pass. Do not leave the tab: you get '+MAX_STRIKES+' warnings, then the quiz auto-submits. No copying text, no right-click.</div></div>';
    return;
  }
  renderQuizQ();
}
function quizEnter(){
  var v=(document.getElementById("q_id").value||"").trim().toUpperCase();
  var dbx=db();
  if(v=="BRIXX-DEMO"){quizState={appId:null,answers:Array(Q.length).fill(-1),i:0,left:QUIZ_MINS*60,running:true,strikes:0};render();return;}
  var a=dbx.apps.find(function(x){return x.id==v});
  if(a&&a.status=="quiz-unlocked"){startQuiz(a.id);}
  else{modal("<h3>Not unlocked</h3><p style='margin:10px 0'>That application is not shortlisted for the quiz yet. Wait for the shortlist message.</p><button class='btn burg' onclick='closeModal()'>Okay</button>");}
}
function renderQuizQ(){
  var s=quizState,i=s.i;
  var mm=String(Math.floor(s.left/60)).padStart(2,"0"),ss=String(s.left%60).padStart(2,"0");
  var q=Q[i],h='<div class="timer"><span>Question '+(i+1)+' of '+Q.length+'</span><div style="flex:1;height:8px;background:#3a333d;border-radius:99px;overflow:hidden"><i style="display:block;height:100%;width:'+Math.round((i)/Q.length*100)+'%;background:var(--gold)"></i></div><b id="clock">'+mm+':'+ss+'</b><span class="stat" style="color:#ffb7b7">Warnings '+s.strikes+'/'+MAX_STRIKES+'</span><button class="btn sm gold" onclick="finishQuiz()">Submit</button></div>';
  if(s.strikes>0)h+='<div class="warnbar">Warning '+s.strikes+' of '+MAX_STRIKES+': you left the quiz tab. At '+MAX_STRIKES+' the quiz submits automatically.</div>';
  h+='<div class="card"><h3 style="margin-bottom:12px">'+esc(q[0])+'</h3>';
  for(var k=1;k<=4;k++){h+='<label class="qopt'+(s.answers[i]==k-1?" pick":"")+'" onclick="pickOpt('+(k-1)+')">'+esc(q[k])+'</label>';}
  h+='<div style="display:flex;justify-content:space-between;margin-top:16px">'+
  '<button class="btn line" onclick="quizMove(-1)"'+(i==0?" disabled":"")+'>Previous</button>'+
  (i<Q.length-1?'<button class="btn burg" onclick="quizMove(1)">Next</button>':'<button class="btn gold" onclick="finishQuiz()">Submit quiz</button>')+
  '</div></div>';
  document.getElementById("view").innerHTML=h;
  document.getElementById("clock").textContent=mm+":"+ss;
}
function pickOpt(k){quizState.answers[quizState.i]=k;renderQuizQ();}
function quizMove(d){quizState.i=Math.max(0,Math.min(Q.length-1,quizState.i+d));renderQuizQ();}
function quizTick(){
  if(!quizState||!quizState.running)return;
  quizState.left--;
  var c=document.getElementById("clock");
  if(c){var mm=String(Math.floor(Math.max(0,quizState.left)/60)).padStart(2,"0"),ss=String(Math.max(0,quizState.left)%60).padStart(2,"0");c.textContent=mm+":"+ss;}
  if(quizState.left<=0){finishQuiz(true);}
}
setInterval(quizTick,1000);
var away=false;
function quizAway(){if(!quizState||!quizState.running||away)return;away=true;quizState.strikes++;if(quizState.strikes>=MAX_STRIKES){finishQuiz(true);}else if(quizState.i>-1){renderQuizQ();}}
function quizBack(){away=false;}
window.addEventListener("blur",quizAway);window.addEventListener("focus",quizBack);
document.addEventListener("visibilitychange",function(){document.hidden?quizAway():quizBack();});
document.addEventListener("contextmenu",function(e){if(quizState&&quizState.running)e.preventDefault();});
function finishQuiz(auto){
  if(!quizState)return;
  quizState.running=false;
  var s=quizState,right=0;
  for(var i=0;i<Q.length;i++){if(s.answers[i]==Q[i][5])right++;}
  var score=Math.round(right/Q.length*100);
  var pass=score>=PASS_MARK;
  var dbx=db();
  if(s.appId){var a=dbx.apps.find(function(x){return x.id==s.appId});if(a){a.score=score;a.status=pass?"quiz-done":"quiz-done-fail";a.auto=!!auto;}}
  dbx.quiz.push({app:s.appId,score:score,strikes:s.strikes,auto:!!auto,at:new Date().toISOString()});
  save(dbx);
  quizState=null;
  document.getElementById("view").innerHTML='<div class="card" style="text-align:center;padding:36px">'+
  '<div class="big">'+score+'%</div><p style="margin:10px 0;font-weight:700">'+(pass?"Quiz passed. Well done.":"Below the "+PASS_MARK+"% pass mark.")+'</p>'+
  '<p class="stat">'+(auto?("The quiz auto-submitted after "+MAX_STRIKES+" tab-switch warnings. "):"")+ "Your answers and monitoring log went to the leadership team with your application.</p>"+
  '<button class="btn burg" onclick="go(\'status\')">Back to my status</button></div>';
}

/* ---------- MEMBER LOGIN / SIGNUP ---------- */

var pendingPhoto="";
function pickPhoto(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){pendingPhoto=e.target.result;document.getElementById("photoPrev").innerHTML='<div class="avatar"><img src="'+pendingPhoto+'"></div>';};r.readAsDataURL(f);}
function claimNumber(){
  var name=(document.getElementById("c_name").value||"").trim(),ph=(document.getElementById("c_phone").value||"").trim();
  if(!name||!ph){modal("<h3>Missing details</h3><p style='margin:10px 0'>Name and phone are required.</p><button class='btn burg' onclick='closeModal()'>Okay</button>");return;}
  var cls=JSON.parse(localStorage.getItem("brixxClaims")||"[]");
  cls.push({name:name,phone:ph,dept:document.getElementById("c_dept").value,year:(document.getElementById("c_year").value||"").trim(),ts:Date.now(),done:false});
  localStorage.setItem("brixxClaims",JSON.stringify(cls));
  modal("<h3>Claim sent</h3><p style='margin:10px 0'>Leadership will verify you and issue your Brixx number. Watch out for a message on "+esc(ph)+".</p><button class='btn gold' onclick='closeModal()'>Got it</button>");
}
function issueClaim(ci){
  var cls=JSON.parse(localStorage.getItem("brixxClaims")||"[]");if(!cls[ci]||cls[ci].done)return;
  var dbx=db(),n=dbx.members.length+1,id="BRX-26-"+String(n).padStart(4,"0");
  dbx.members.push({id:id,name:cls[ci].name,phone:cls[ci].phone,dept:cls[ci].dept||"Acting",level:1,photo:"",joined:new Date().toISOString().slice(0,10),attendance:100,why:"Founding member."});
  cls[ci].done=true;cls[ci].issued=id;save(dbx);localStorage.setItem("brixxClaims",JSON.stringify(cls));render();
}
function rejectClaim(ci){var cls=JSON.parse(localStorage.getItem("brixxClaims")||"[]");cls.splice(ci,1);localStorage.setItem("brixxClaims",JSON.stringify(cls));render();}
function memberLogin(){
  var id=(document.getElementById("m_id").value||"").trim().toUpperCase();
  var dbx=db(),m=dbx.members.find(function(x){return x.id==id});
  if(!m){modal("<h3>Not found</h3><p style='margin:10px 0'>No member with that number. Register your profile below, or send a claim if you joined before the portal.</p><button class='btn burg' onclick='closeModal()'>Okay</button>");return;}
  localStorage.setItem("brixxSession",m.id);go("dash");
}
function memberRegister(){
  var name=(document.getElementById("r_name").value||"").trim(),ph=(document.getElementById("r_phone").value||"").trim();
  if(!name||!ph){modal("<h3>Missing details</h3><p style='margin:10px 0'>Name and phone are required.</p><button class='btn burg' onclick='closeModal()'>Okay</button>");return;}
  var dbx=db();
  var n=dbx.members.length+1;
  var id="BRX-26-"+String(n).padStart(4,"0");
  var m={id:id,name:name,phone:ph,dept:document.getElementById("r_dept").value,level:1,photo:pendingPhoto,joined:new Date().toISOString().slice(0,10),attendance:100,
  skills:[["Stage presence",40],["Voice & projection",40],["Script & memorisation",40],["Improvisation",35],["Discipline & attendance",100],["Teamwork",50]],log:[["Today","Welcome to The Brixx","Profile created. Level 1 (Probationer) begins now. Your first activity report lands after your first rehearsal."]]};
  dbx.members.push(m);save(dbx);localStorage.setItem("brixxSession",id);
  modal("<h3>Welcome to The Brixx 🎭</h3><p style='margin:10px 0'>Your Brixx number is</p><div class='idline' style='font-size:1.3rem'>"+id+"</div><p class='stat' style='margin:10px 0'>This is your permanent member ID. Keep it.</p><button class='btn gold' onclick='closeModal();go(\"dash\")'>Open my dashboard</button>");
}

/* ---------- DASHBOARD ---------- */
var LEVELS=["Level 1, Probationer","Level 2, Member","Level 3, Senior Member","Level 4, Lead / Principal"];
function viewDash(){
  var id=localStorage.getItem("brixxSession");
  var dbx=db(),m=dbx.members.find(function(x){return x.id==id});
  if(!m){document.getElementById("view").innerHTML='<div class="card">No active session. <a href="#/join">Log in</a> with your Brixx number.</div>';return;}
  var avg=Math.round(m.skills.reduce(function(s,x){return s+x[1]},0)/m.skills.length);
  var h='<div class="sec">My dashboard</div><div class="grid g2">'+
  '<div class="idcard"><div style="display:flex;gap:14px;align-items:center;position:relative;z-index:2"><div class="avatar">'+(m.photo?'<img src="'+m.photo+'">':esc(m.name[0]))+'</div><div><b style="font-size:1.15rem">'+esc(m.name)+'</b><br><span class="idline" style="background:rgba(255,255,255,.15);color:#fff">'+m.id+'</span><br><span style="font-size:.85rem;color:#ffe9c9">'+esc(m.dept)+' \u00b7 '+LEVELS[m.level-1]+'</span></div></div></div>'+
  '<div class="card"><h3>Growth snapshot</h3><div style="display:flex;gap:18px;margin:8px 0"><div><div class="big">'+avg+'%</div><span class="stat">Overall skill index</span></div><div><div class="big">'+m.attendance+'%</div><span class="stat">Attendance</span></div><div><div class="big">L'+m.level+'</div><span class="stat">Level</span></div></div>'+
  '<p class="stat">Levels: Probationer \u2192 Member \u2192 Senior Member \u2192 Lead/Principal. Move up on lead roles, assessments and attendance.</p></div></div>'+
  '<div class="grid g2" style="margin-top:16px">'+
  '<div class="card"><h3>Skill progression</h3>'+m.skills.map(function(s){return '<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:.86rem"><span>'+esc(s[0])+'</span><b>'+s[1]+'%</b></div><div class="bar"><i style="width:'+s[1]+'%"></i></div></div>'}).join("")+'</div>'+
  '<div class="card"><h3>Activity reports</h3>'+m.log.map(function(l){return '<div style="margin:12px 0"><b style="font-size:.9rem">'+esc(l[1])+'</b> <span class="stat">'+esc(l[0])+'</span><p class="stat" style="margin-top:2px">'+esc(l[2])+'</p></div>'}).join("")+'</div></div>'+
  '<div class="card" style="margin-top:16px"><h3>Announcements</h3>'+dbx.announcements.map(function(a){return '<div style="margin:10px 0"><b style="font-size:.92rem">'+esc(a.t)+'</b><p class="stat">'+esc(a.d)+'</p></div>'}).join("")+'</div>';
  document.getElementById("view").innerHTML=h;
}

/* ---------- PAYMENTS ---------- */
var FEES=[["Branded T-shirt",5000],["Face cap",2500],["Water bottle",3000],["Jotter + pen",2000],["Lapel pin",1500],["Portal & website maintenance",6000]];
function viewPay(){
  var qs=location.hash.split("?")[1]||"";
  var appId=decodeURIComponent((qs.split("app=")[1]||"").split("&")[0]);
  var dbx=db(),a=dbx.apps.find(function(x){return x.id==appId});
  var total=FEES.reduce(function(s,x){return s+x[1]},0);
  var h='<div class="sec">Acceptance fee</div>';
  if(!a){h+='<div class="card">Open this page from your selection message on the Application status page.</div>';}
  else{
    var rec=dbx.payments.find(function(p){return p.app==appId});
    h+='<div class="card"><h3 style="color:var(--burg)">'+esc(a.name)+' \u00b7 selected for '+esc(a.dept)+'</h3>'+
    '<table><tr><th>Item</th><th style="text-align:right">Amount</th></tr>'+
    FEES.map(function(f){return '<tr><td>'+f[0]+'</td><td style="text-align:right">'+fmt(f[1])+'</td></tr>'}).join("")+
    '<tr><th>Total</th><th style="text-align:right">'+fmt(total)+'</th></tr></table>'+
    '<div class="notice">Pay by bank transfer to:<br><b>GTBank</b> \u00b7 000 000 0000 \u00b7 The Brixx Production<br>(placeholder details, leadership sets the real account). Use your application ID '+a.id+' as the transfer narration.</div>';
    if(rec&&rec.status=="awaiting"){h+='<p class="stat">Proof received ('+esc(rec.proof)+'), awaiting verification by the leadership team.</p>';}
    else if(rec&&rec.status=="verified"){h+='<div class="pill mem">Payment verified. Welcome to The Brixx!</div><p class="stat">Register your profile at Member login to claim your Brixx number.</p>';}
    else{h+='<label>Upload proof of payment (screenshot or receipt)</label><input type="file" onchange="uploadProof(\''+a.id+'\',this)"><div id="proofStat" class="stat" style="margin-top:8px"></div>';}
    h+='</div>';
  }
  document.getElementById("view").innerHTML=h;
}
function uploadProof(appId,inp){
  var f=inp.files[0];if(!f)return;
  var dbx=db();
  dbx.payments.push({app:appId,proof:f.name,amount:FEES.reduce(function(s,x){return s+x[1]},0),status:"awaiting",at:new Date().toISOString()});
  save(dbx);viewPay();
}

/* ---------- ADMIN ---------- */
function viewAdmin(){
  if(!sessionStorage.getItem("brixxAdmin")){
    document.getElementById("view").innerHTML='<div class="sec">Leadership admin</div>'+
    '<div class="card" style="max-width:440px"><h3 style="margin-bottom:6px">Leaders sign in</h3>'+
    '<label>Password</label><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="a_pw" type="password" style="flex:1;min-width:180px" onkeydown="if(event.key===&quot;Enter&quot;)adminLogin()"><button class="btn burg" onclick="adminLogin()">Enter</button></div></div>';
    return;
  }
  var dbx=db(),apps=dbx.apps,members=dbx.members,pays=dbx.payments;
  var c={submitted:0,"quiz-unlocked":0,"quiz-done":0,"quiz-done-fail":0,selected:0,member:0,rejected:0};
  apps.forEach(function(a){if(c[a.status]!=null)c[a.status]++;});
  var rev=pays.filter(function(p){return p.status=="verified"}).reduce(function(t,p){return t+(p.amount||0)},0);
  function stat(v,l){return '<div class="card" style="text-align:center;padding:18px 8px"><div class="big">'+v+'</div><div class="stat" style="margin-top:4px;font-weight:600">'+l+'</div></div>';}
  var h='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div class="sec" style="margin:0;flex:1;min-width:220px">Leadership admin</div><button class="btn sm gold" onclick="exportCsv()">Export CSV</button><button class="btn sm line" onclick="sessionStorage.removeItem(\'brixxAdmin\');render()">Log out</button></div>';
  h+='<div class="grid g3" style="margin-top:16px">'+stat(apps.length,'Applications')+stat(c["quiz-unlocked"],'Shortlisted')+stat(c["quiz-done"],'Quiz passed')+stat(c.selected,'Selected')+stat(members.length,'Members')+stat(fmt(rev),'Verified fees')+'</div>';
  var cls=JSON.parse(localStorage.getItem("brixxClaims")||"[]"),pend=cls.filter(function(x){return !x.done});
  if(pend.length){
    h+='<div class="card" style="margin-top:18px"><h3>Member number claims ('+pend.length+' pending)</h3><p class="stat">Long-time members without a number. Verify them, then issue their Brixx number.</p>';
    pend.forEach(function(c){
      var ci=cls.indexOf(c);
      h+='<div class="row" style="align-items:center;border-top:1px solid var(--line);padding:12px 0"><div style="flex:1;min-width:180px"><b>'+esc(c.name)+'</b><div class="stat">'+esc(c.phone)+' \u00b7 '+esc(c.dept||"")+(c.year?' \u00b7 joined '+esc(c.year):'')+'</div></div><button class="btn sm gold" onclick="issueClaim('+ci+')">Issue number</button><button class="btn sm line" onclick="rejectClaim('+ci+')">Reject</button></div>';
    });
    h+='</div>';
  }
  h+='<div class="card" style="margin-top:16px"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px"><h3 style="margin:0;flex:1;min-width:160px">Applications ('+apps.length+')</h3><select id="ad_f" onchange="adminFilter()" style="width:auto"><option value="">All statuses</option><option value="submitted">Submitted</option><option value="quiz-unlocked">Shortlisted / quiz open</option><option value="quiz-done">Quiz passed</option><option value="quiz-done-fail">Quiz failed</option><option value="selected">Selected</option><option value="member">Member</option><option value="rejected">Rejected</option></select><input id="ad_q" placeholder="Search name, ID, dept, phone..." style="flex:1;min-width:180px;margin:0" oninput="adminFilter()"></div><div id="ad_tbl">'+adminAppsTable(apps)+'</div></div>';
  h+='<div class="card" style="margin-top:16px"><h3>Payments ('+pays.length+')</h3>'+(pays.length?'<table><tr><th>Application</th><th>Amount</th><th>Proof</th><th>Status</th></tr>'+pays.map(function(p){return '<tr><td class="idline">'+p.app+'</td><td>'+fmt(p.amount)+'</td><td class="stat">'+esc(p.proof)+'</td><td>'+(p.status=="verified"?'<span class="pill mem">Verified</span>':'<span class="pill pay">Awaiting check</span>')+'</td></tr>'}).join("")+'</table>':'<p class="stat">No payments recorded yet.</p>')+'</div>';
  h+='<div class="card" style="margin-top:16px"><h3>Members ('+members.length+')</h3>'+(members.length?'<table><tr><th>ID</th><th>Name</th><th>Dept</th><th>Level</th><th>Attendance</th></tr>'+members.map(function(m){return '<tr><td class="idline">'+m.id+'</td><td>'+esc(m.name)+'</td><td>'+esc(m.dept)+'</td><td>L'+m.level+'</td><td>'+m.attendance+'%</td></tr>'}).join("")+'</table>':'<p class="stat">No members yet. Verify a selected applicant\'s fee to add the first one.</p>')+'</div>';
  h+='<div class="card" style="margin-top:16px"><h3>Announcements ('+dbx.announcements.length+')</h3><label>Title</label><input id="an_t"><label>Message</label><textarea id="an_d" rows="2"></textarea><button class="btn burg" style="margin-top:10px" onclick="postAnn()">Publish to all dashboards</button>'+(dbx.announcements.length?'<div style="margin-top:14px">'+dbx.announcements.map(function(a,i){return '<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f0ebe4"><div style="flex:1"><b>'+esc(a.t)+'</b><br><span class="stat">'+esc(a.d)+'</span></div><button class="btn sm line" onclick="delAnn('+i+')">Delete</button></div>'}).join("")+'</div>':'')+'</div>';
  document.getElementById("view").innerHTML=h;
}
function adminAppsTable(list){
  var h='<table><tr><th>ID</th><th>Name</th><th>Dept</th><th>Status</th><th>Quiz</th><th>Monologue</th><th>Actions</th></tr>';
  list.forEach(function(a){
    var acts='';
    if(a.status=="submitted")acts="<button class=\"btn sm burg\" onclick=\"act('shortlist','"+a.id+"')\">Shortlist + unlock quiz</button> <button class=\"btn sm line\" onclick=\"act('reject','"+a.id+"')\">Reject</button>";
    else if(a.status=="quiz-unlocked")acts="<span class=\"stat\">Quiz open on their side</span> <button class=\"btn sm line\" onclick=\"act('reject','"+a.id+"')\">Reject</button>";
    else if(a.status=="quiz-done"||a.status=="quiz-done-fail")acts="<button class=\"btn sm burg\" onclick=\"act('select','"+a.id+"')\">Select</button> <button class=\"btn sm line\" onclick=\"act('reject','"+a.id+"')\">Reject</button>";
    else if(a.status=="selected")acts="<button class=\"btn sm gold\" onclick=\"act('confirmpay','"+a.id+"')\">Verify fee & make member</button>";
    else if(a.status=="member")acts="<span class=\"pill mem\">Member"+(a.brixId?" &middot; "+a.brixId:"")+"</span>";
    else if(a.status=="rejected")acts="<span class=\"stat\">Closed</span>";
    h+="<tr><td class=\"idline\">"+a.id+"</td><td>"+esc(a.name)+"<br><span class=\"stat\">"+esc(a.phone||"")+"</span></td><td>"+esc(a.dept||"")+"</td><td>"+statusPill(a.status)+"<br><span class=\"stat\">"+esc(a.created||"")+"</span></td><td>"+(a.score!=null?a.score+"%"+(a.auto?" (auto)":""):"\u2013")+"</td><td class=\"stat\">"+esc(a.video||"")+"</td><td>"+acts+"</td></tr>";
  });
  if(!list.length)h+="<tr><td colspan=\"7\" class=\"stat\" style=\"padding:16px 6px\">No applications match this filter.</td></tr>";
  return h+"</table>";
}
function adminFilter(){
  var q=((document.getElementById("ad_q")||{}).value||"").toLowerCase(),f=((document.getElementById("ad_f")||{}).value||"");
  var list=db().apps.filter(function(a){return (!f||a.status==f)&&(!q||((a.name+" "+a.id+" "+(a.dept||"")+" "+(a.phone||"")).toLowerCase().indexOf(q)>=0));});
  document.getElementById("ad_tbl").innerHTML=adminAppsTable(list);
}
function exportCsv(){
  var rows=[["ID","Name","Phone","Email","Dept","Status","Quiz %","Created","Brixx ID"]];
  db().apps.forEach(function(a){rows.push([a.id,a.name,a.phone||"",a.email||"",a.dept||"",a.status,a.score!=null?a.score:"",(a.created||""),a.brixId||""]);});
  var csv=rows.map(function(r){return r.map(function(x){return '"'+String(x==null?"":x).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
  var b=new Blob([csv],{type:"text/csv"}),u=URL.createObjectURL(b),el=document.createElement("a");
  el.href=u;el.download="brixx-applications.csv";document.body.appendChild(el);el.click();el.remove();setTimeout(function(){URL.revokeObjectURL(u)},600);
}
function delAnn(i){var dbx=db();dbx.announcements.splice(i,1);save(dbx);render();}
function adminLogin(){if((document.getElementById("a_pw").value||"")=="brixxx2026"){sessionStorage.setItem("brixxAdmin","1");render();}else{modal("<h3>Wrong password</h3><button class='btn burg' onclick='closeModal()'>Okay</button>");}}

function act(kind,appId){
  var dbx=db(),a=dbx.apps.find(function(x){return x.id==appId});if(!a)return;
  if(kind=="shortlist")a.status="quiz-unlocked";
  if(kind=="reject")a.status="rejected";
  if(kind=="select")a.status="selected";
  if(kind=="confirmpay"){
    a.status="member";
    var p=dbx.payments.find(function(x){return x.app==appId});if(p)p.status="verified";
    var n=dbx.members.length+1;var id="BRX-26-"+String(n).padStart(4,"0");
    dbx.members.push({id:id,name:a.name,phone:a.phone,dept:a.dept,level:1,photo:"",joined:new Date().toISOString().slice(0,10),attendance:100,
    skills:[["Stage presence",40],["Voice & projection",40],["Script & memorisation",40],["Improvisation",35],["Discipline & attendance",100],["Teamwork",50]],log:[["Today","Welcome to The Brixx","Profile created from application "+appId+". Level 1 (Probationer) begins."]]});
    a.brixId=id;
  }
  save(dbx);render();
}
function postAnn(){
  var t=(document.getElementById("an_t").value||"").trim(),d=(document.getElementById("an_d").value||"").trim();
  if(!t)return;var dbx=db();dbx.announcements.unshift({t:t,d:d});save(dbx);render();
}

function render(){
  renderNav();
  var r=(location.hash.replace("#/","").split("?")[0]||"admin");
  if(!routes[r])r="admin";
  if(r=="home"){location.replace("/");return;}
  if(r!="admin"){location.replace("/#/"+r);return;}
  ({home:viewHome,apply:viewApply,status:viewStatus,quiz:viewQuiz,join:viewJoin,dash:viewDash,pay:viewPay,admin:viewAdmin})[r]();
}
window.addEventListener("hashchange",function(){if(quizState&&location.hash.replace("#/","").split("?")[0]!="quiz"){quizState.running=false;}});
render();


</script>
